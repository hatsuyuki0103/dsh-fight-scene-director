name: Smoke (real dsh install)

# The one thing unit tests cannot prove: that `dsh plugin --profile <p> add`
# actually resolves this repository, reconciles it as a profile bundle layer,
# and boots with the skill registered.
#
# Runs on a schedule and on demand, not on every push, because it installs the
# harness from the public registry and therefore depends on network state
# outside this repository's control.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  install-from-git:
    name: dsh plugin add github:${{ github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install pnpm and the harness
        run: |
          set -euo pipefail
          npm install -g pnpm@10
          npm install -g @deepseek-ai/dsh
          dsh --version

      # This is the exact spec a user copies out of the README. It must be the
      # primary thing this workflow exercises, not a stand-in for it.
      - name: Install this repository from GitHub into a scratch profile
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_HOME"
          dsh plugin --profile headless add "github:${{ github.repository }}"

      - name: Assert the plugin joined the bundle layer list
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          node -e "
            const fs = require('node:fs')
            const p = process.env.DSH_HOME + '/profiles/headless/package.json'
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'))
            const bundles = pkg.dsh?.profile?.bundles ?? []
            if (!bundles.includes('dsh-fight-scene-director')) {
              console.error('bundles:', bundles)
              throw new Error('plugin did not reconcile into dsh.profile.bundles')
            }
            if (!pkg.dependencies['dsh-fight-scene-director']) {
              throw new Error('dependency missing from profile manifest')
            }
            console.log('bundle layer OK:', bundles.join(', '))
          "

      # `dsh plugin list` is a pnpm passthrough: it proves a dependency exists,
      # not that anything is mounted. The composed tree is the real check.
      # NOTE: the row id is the PACKAGE name. `fsd-skills` is the provider's
      # internal name and does not appear in the profile tree at all.
      - name: Assert the composed profile tree carries the plugin row
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh --profile headless --dump-config > "$RUNNER_TEMP/tree.yml"
          echo "--- composed row ---"
          grep -B1 -A2 'id: dsh-fight-scene-director' "$RUNNER_TEMP/tree.yml"
          grep -q 'id: dsh-fight-scene-director' "$RUNNER_TEMP/tree.yml" \
            || { echo 'FAIL: plugin row id missing from composed tree'; exit 1; }
          grep -q 'name: dsh-fight-scene-director' "$RUNNER_TEMP/tree.yml" \
            || { echo 'FAIL: plugin row does not name the package'; exit 1; }
          if grep -q 'fsd-skills' "$RUNNER_TEMP/tree.yml"; then
            echo 'FAIL: provider-internal name leaked into a patch row id'; exit 1
          fi
          echo 'composed tree OK'

      - name: Load the skill out of the installed copy
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          node --input-type=module -e "
            import path from 'node:path'
            import { existsSync } from 'node:fs'
            const base = process.env.DSH_HOME + '/profiles/headless/node_modules/dsh-fight-scene-director'
            const mod = await import('file://' + base + '/index.mjs')
            const factories = []
            mod.apply({ skills: { registerProvider: (f) => { factories.push(f); return () => {} } } }, {})
            const provider = await factories[0]()
            const list = await provider.list()
            const names = list.map((c) => c.name)
            if (names.join(',') !== 'fight-scene-director') throw new Error('unexpected catalog: ' + names)
            const def = await provider.get(list[0])
            if (!def.content.includes('## Route the Request')) throw new Error('skill body not loaded')
            const refs = [...new Set([...def.content.matchAll(/\]\((references\/[^)]+\.md)\)/g)].map((m) => m[1]))]
            const missing = refs.filter((r) => !existsSync(path.join(def.resourceBase.path, r)))
            if (missing.length) throw new Error('dangling references: ' + missing.join(', '))
            console.log('installed package OK:', names[0], '|', refs.length, 'references resolve')
          "
